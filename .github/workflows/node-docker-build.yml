#node application and docker build workflow
name: Node.js Docker Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checking out the github repository
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build Docker image
        run: docker build -t my-node-app .
      - name: Run Docker container
        run: docker run -d -p 3000:3000 my-node-app