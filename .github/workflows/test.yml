name: Tests
on: [push,pull_request]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: checking respository
              uses: actions/checkout@v4

            - name: setup python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'
            - name: Install dependencies
              run: 
                pip install -r requirements.txt

            - name: Run Test
              run: pytest test_app.py

